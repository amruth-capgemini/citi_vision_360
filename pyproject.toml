[project]
name = "citi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "amruth-pai.thukaram@capgemini.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "neo4j>=6.0,<7",
    "pyyaml>=6.0.3",
]

[project.scripts]
citi-project = "citi_project:main"
citi-kg = "citi_project.services.knowledge_graph.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "neo4j_integration: explicitly enabled isolated live Neo4j tests",
    "openai_integration: explicitly enabled live OpenAI tests using synthetic fixtures",
]
