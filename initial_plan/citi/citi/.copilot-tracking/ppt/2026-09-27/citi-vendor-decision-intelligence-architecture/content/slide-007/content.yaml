speaker_notes: |
  The runtime begins with an authenticated request and evaluates entitlement and policy before any tool use.
  The decision supervisor produces an allow-listed task plan. Specialists are limited to the plan and cannot invoke unapproved tools.
  Every specialist returns the shared evidence contract. Validation and reconciliation occur before explanation and the decision brief.
  The human reviewer remains the decision authority. The runtime is read and calculate only; it has no writeback path to systems of record.