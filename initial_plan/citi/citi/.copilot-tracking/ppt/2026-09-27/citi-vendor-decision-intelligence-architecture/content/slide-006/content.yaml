speaker_notes: |
  This target architecture separates source ingestion, canonical mastering, semantic meaning, and serving stores.
  Vendor identity resolution, data quality, reconciliation, metadata, catalog, and lineage create the governed foundation.
  The semantic layer exposes approved metrics and SQL. Graph and document retrieval remain governed and entitlement-aware. Scenario calculations are non-destructive and do not write back to systems of record.
  The right panel deliberately presents implementation options rather than product recommendations; platform selection follows Citi approval, NFR, data classification, scale, latency, and operability assessment.