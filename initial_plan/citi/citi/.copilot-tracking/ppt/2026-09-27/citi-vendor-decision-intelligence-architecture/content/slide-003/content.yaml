speaker_notes: |
  This slide makes the architecture layers explicit. Entitlements are enforced before retrieval.
  The supervisor delegates only approved work to four domain specialists. Specialists return findings through one evidence contract.
  Validation and explanation are mandatory before a decision brief reaches a human approver.
  Data services are governed and scenarios are non-destructive. The data foundation retains definitions, lineage, entity resolution, and quality context.