  - type: shape
    shape: rounded_rectangle
    left: 0.72
    top: 6.25
    width: 11.98
    height: 0.48
    fill: "#FFF0E7"
    text: "Boundary: recommendations are options, not approvals; all downstream execution stays outside the agent boundary."
    text_font: "Segoe UI"
    text_size: 11
    text_color: "#A54412"
    text_bold: true
speaker_notes: |
  The design uses a supervisor to create a bounded investigation plan and delegate only to the relevant approved specialists.
  Specialists do not approve decisions, access unrestricted data, or execute source-system actions.
  Their output is validated evidence and explanation for a human decision owner to review.