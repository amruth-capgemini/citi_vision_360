speaker_notes: |
  This deck describes an FSD-informed target architecture for Citi Vendor Decision Intelligence.
  It is a semi-agentic decision-support design: agents investigate within bounded controls, while humans retain accountability for decisions and downstream action.
  It does not claim completed user research, technical validation, production readiness, or production integration.