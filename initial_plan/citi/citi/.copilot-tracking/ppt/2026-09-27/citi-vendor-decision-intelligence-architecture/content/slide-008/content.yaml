speaker_notes: |
  This control plane is a target-state set of capabilities, not a claim that particular products are deployed.
  Security begins with identity, RBAC or ABAC, and fine-grained data and retrieval controls. Data governance covers classification, quality, freshness, lineage, and semantic definitions.
  AI governance adds model and prompt lifecycle management, evaluation, red teaming, grounding, and allowed tool controls. Operations maintains SLOs, monitoring, incident management, and controlled change.
  Audit evidence and human approval establish accountability. The architecture has no agent writeback path; operational actions stay within separately authorized human workflows.