[project]
name = "citi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "amruth-pai.thukaram@capgemini.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "langgraph>=0.6",
    "neo4j>=6.0,<7",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "sqlglot>=27",
]

[project.scripts]
citi-project = "citi_project:main"
citi-kg = "citi_project.services.knowledge_graph.cli:main"
citi-pg = "citi_project.services.postgres.cli:main"
citi-catalog = "citi_project.services.catalog.cli:main"
citi-agent = "citi_project.services.agents.cli:main"
citi-api = "citi_project.api.app:main"

[project.optional-dependencies]
agents = [
    "openai>=1.40",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "httpx>=0.27",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "neo4j_integration: explicitly enabled isolated live Neo4j tests",
    "openai_integration: explicitly enabled live OpenAI tests using synthetic fixtures",
    "pg_integration: explicitly enabled live PostgreSQL tests using CITI_PG_DSN and CITI_PG_READER_DSN",
]
